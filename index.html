<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EduJurnal | Uji Login</title><style>body{font:16px system-ui;background:#f3f7f5;margin:0;color:#18372d}.wrap{max-width:510px;margin:35px auto;padding:18px}.panel{background:white;border-radius:18px;padding:24px;box-shadow:0 6px 25px #1232}h1{margin:0;color:#166534}p{line-height:1.5}label{display:block;margin-top:15px;font-weight:600}input{box-sizing:border-box;width:100%;padding:13px;margin-top:6px;border:1px solid #b9c9c1;border-radius:9px;font-size:16px}button{background:#166534;color:white;border:0;border-radius:9px;padding:13px 17px;margin-top:16px;font-size:16px;width:100%}button.secondary{background:#415b52}pre{white-space:pre-wrap;word-break:break-word;background:#edf4ef;padding:12px;border-radius:8px}small{color:#53665e}#session{display:none}#error{color:#a51d27}</style></head><body><main class="wrap"><section class="panel"><h1>EduJurnal</h1><p>Uji login dan akses data sekolah (versi pengujian).</p><div id="config"><label>Project URL Supabase<input id="url" placeholder="https://xxxxx.supabase.co" autocomplete="off"></label><label>Publishable / anon key<input id="key" placeholder="sb_publishable_... atau eyJ..." autocomplete="off"></label><small>Jangan masukkan service_role atau secret key. Project URL dan publishable key memang dirancang untuk aplikasi publik.</small><button id="save">Simpan konfigurasi perangkat ini</button></div><div id="login"><label>Email<input id="email" type="email" autocomplete="username"></label><label>Password<input id="password" type="password" autocomplete="current-password"></label><button id="signIn">Masuk</button></div><div id="session"><p id="who"></p><button id="check">Periksa akses sekolah</button><button id="signOut" class="secondary">Keluar</button></div><p id="error" role="alert"></p><pre id="result">Belum diuji.</pre></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id),say=s=>$('error').textContent=s,show=s=>$('result').textContent=s;let client=null;const stored=JSON.parse(localStorage.getItem('edujurnal_public_config')||'{}');$('url').value=stored.url||'';$('key').value=stored.key||'';
function init(){if(!window.supabase){say('Library Supabase gagal dimuat. Periksa internet/CDN.');return false;}const url=$('url').value.trim(),key=$('key').value.trim();if(!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(url)){say('Project URL Supabase tidak valid.');return false;}if(!key||key.startsWith('sb_secret_')){say('Gunakan publishable/anon key, bukan secret key.');return false;}client=window.supabase.createClient(url,key,{auth:{persistSession:true,autoRefreshToken:true}});return true;}
async function refresh(){if(!client)return;const {data,error}=await client.auth.getUser();const user=data?.user; if(error&&error.name!=='AuthSessionMissingError')say(error.message);$('login').style.display=user?'none':'block';$('session').style.display=user?'block':'none';$('who').textContent=user?'Login: '+user.email:'';if(user)await check();}
async function check(){say('');const {data:schools,error:e1}=await client.from('schools').select('id,name,code').order('name');const {data:members,error:e2}=await client.from('school_memberships').select('school_id,role,user_id');if(e1||e2){show('Gagal membaca data: '+(e1?.message||e2?.message));return;}show(JSON.stringify({jumlah_sekolah_terlihat:schools.length,sekolah:schools.map(s=>({nama:s.name,kode:s.code})),keanggotaan_terlihat:members.map(m=>({school_id:m.school_id,role:m.role}))},null,2));}
$('save').onclick=async()=>{say('');if(!init())return;localStorage.setItem('edujurnal_public_config',JSON.stringify({url:$('url').value.trim(),key:$('key').value.trim()}));show('Konfigurasi publik tersimpan di browser ini.');await refresh();};
$('signIn').onclick=async()=>{say('');if(!client&&!init())return;const {error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('password').value='';if(error){say('Login gagal: '+error.message);return;}await refresh();};
$('signOut').onclick=async()=>{if(!client)return;const {error}=await client.auth.signOut();if(error){say(error.message);return;}show('Sudah keluar.');await refresh();};$('check').onclick=check;if(stored.url&&stored.key&&init())refresh();})();
</script></body></html>
